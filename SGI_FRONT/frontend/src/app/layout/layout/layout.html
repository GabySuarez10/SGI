<div class="app-layout">

  <!-- Menú lateral -->
  <app-sidebar
    [open]="sidebarOpen"
    (cerrar)="closeSidebar()">
  </app-sidebar>


  <!-- Fondo oscuro detrás del menú en celular: al tocarlo se cierra -->
  <div
    class="sidebar-overlay"
    [class.visible]="sidebarOpen"
    aria-hidden="true"
    (click)="closeSidebar()">
  </div>


  <!-- Contenido principal -->
  <div class="main-area">

    <app-header
      (menuToggle)="toggleSidebar()">
    </app-header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>


  <!-- Foto ampliada (se abre al tocar la imagen de un producto) -->
  <app-visor-imagen></app-visor-imagen>

</div>
