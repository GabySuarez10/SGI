<aside
  class="sidebar"
  [class.sidebar-open]="open"
  aria-label="Menú principal">

  <!-- Marca -->
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">P</div>

    <div class="brand-text">
      <span class="brand-name">Pintarte</span>
      <span class="brand-subtitle">Inventario SGI</span>
    </div>

    <!-- Cerrar (solo celular) -->
    <button
      type="button"
      class="close-button"
      aria-label="Cerrar menú"
      (click)="cerrar.emit()">
      <app-icono nombre="cerrar" [tamano]="20"></app-icono>
    </button>
  </div>


  <!-- Navegación -->
  <nav class="navigation">

    <div class="nav-section" *ngFor="let seccion of secciones">

      <span class="section-title">{{ seccion.titulo }}</span>

      <a
        *ngFor="let enlace of seccion.enlaces"
        class="nav-item"
        [routerLink]="enlace.ruta"
        [queryParams]="enlace.parametros ?? null"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: !!enlace.exacto }"
        (click)="cerrar.emit()">

        <app-icono class="nav-icon" [nombre]="enlace.icono" [tamano]="19"></app-icono>
        <span>{{ enlace.texto }}</span>

      </a>

    </div>

  </nav>


  <!-- Configuración -->
  <div class="sidebar-bottom">

    <a
      class="nav-item"
      routerLink="/configuracion"
      routerLinkActive="active"
      (click)="cerrar.emit()">

      <app-icono class="nav-icon" nombre="configuracion" [tamano]="19"></app-icono>
      <span>Configuración</span>

    </a>

  </div>

</aside>
