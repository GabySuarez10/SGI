<header class="header">

  <!-- Parte izquierda -->
  <div class="header-left">

    <!-- Botón menú móvil -->
    <button
      class="menu-button"
      type="button"
      aria-label="Menú">

      <span>☰</span>

    </button>

    <div class="header-title">
      <h1>Inicio</h1>
      <p>Gestiona el inventario de Pintarte</p>
    </div>

  </div>


  <!-- Parte derecha -->
  <div class="header-actions">

    <!-- Notificaciones -->
    <button
      class="notification-button"
      type="button"
      aria-label="Notificaciones">

      <span>♧</span>
      <span class="notification-dot"></span>

    </button>


    <!-- Usuario -->
    <div class="user-profile">

      <div class="avatar">
        G
      </div>

      <div class="user-menu">

  <button
    type="button"
    class="user-button"
    (click)="alternarMenuUsuario()">

    <div class="user-avatar">
      GS
    </div>

    <div class="user-info">
      <strong>Gabriela Suárez</strong>
      <span>Administrador</span>
    </div>

    <span class="user-arrow">
      {{ menuUsuarioAbierto ? '⌃' : '⌄' }}
    </span>

  </button>


  <div
    class="user-dropdown"
    *ngIf="menuUsuarioAbierto">

    <button
      type="button"
      class="dropdown-item"
      (click)="irAConfiguracion()">

      <span>⚙</span>
      <span>Mi cuenta</span>

    </button>

    <div class="dropdown-divider"></div>

    <button
      type="button"
      class="dropdown-item logout"
      (click)="cerrarSesion()">

      <span>↪</span>
      <span>Cerrar sesión</span>

    </button>

  </div>

</div>

    </div>

  </div>

</header>
