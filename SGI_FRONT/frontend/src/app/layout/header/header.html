<header class="header">

  <div class="header-left">

    <!-- Abre el menú lateral (solo celular y tablet) -->
    <button
      class="menu-button"
      type="button"
      aria-label="Abrir menú"
      (click)="menuToggle.emit()">
      <app-icono nombre="menu" [tamano]="22"></app-icono>
    </button>

    <!-- Escritorio: la fecha (el título ya está en la página) -->
    <div class="header-fecha">
      <strong>{{ hoy | date:"EEEE d 'de' MMMM" }}</strong>
      <span>Pintarte · Inventario</span>
    </div>

    <!-- Celular: nombre de la sección actual -->
    <div class="header-title">
      <h1>{{ titulo }}</h1>
      <p>{{ descripcion }}</p>
    </div>

  </div>


  <!-- Usuario -->
  <div class="user-menu">

    <button
      type="button"
      class="user-button"
      [attr.aria-expanded]="menuUsuarioAbierto"
      aria-haspopup="menu"
      (click)="alternarMenuUsuario()">

      <span class="user-avatar">{{ iniciales }}</span>

      <span class="user-info">
        <strong>{{ nombreUsuario }}</strong>
        <span>Sesión iniciada</span>
      </span>

      <app-icono class="user-arrow" [class.abierto]="menuUsuarioAbierto" nombre="abajo" [tamano]="16"></app-icono>

    </button>


    <div class="user-dropdown" role="menu" *ngIf="menuUsuarioAbierto">

      <button type="button" class="dropdown-item" role="menuitem" (click)="irAConfiguracion()">
        <app-icono nombre="usuario" [tamano]="18"></app-icono>
        <span>Mi cuenta</span>
      </button>

      <div class="dropdown-divider"></div>

      <button type="button" class="dropdown-item logout" role="menuitem" (click)="cerrarSesion()">
        <app-icono nombre="salir" [tamano]="18"></app-icono>
        <span>Cerrar sesión</span>
      </button>

    </div>

  </div>

</header>
