<div class="editar-producto-page">

  <div class="page-header">

    <div>
      <h1>Editar producto</h1>
      <p>
        Actualiza la información del producto.
      </p>
    </div>

    <button
      type="button"
      class="back-button"
      (click)="cancelar()"
    >
      ← Volver
    </button>

  </div>


  <section class="form-card">

    <div class="form-card-header">

      <div>
        <h2>Información del producto</h2>
        <p>
          Modifica los datos que necesites.
        </p>
      </div>

      <span class="product-code">
        {{ producto.referencia }}
      </span>

    </div>


    <div class="estado-carga" *ngIf="cargando">
      Cargando producto...
    </div>

    <div class="mensaje-error" *ngIf="error">
      {{ error }}
    </div>

    <div class="form-content">

      <div class="image-section">

        <div class="image-preview">

          <img
            [src]="producto.imagen || imagenPorDefecto"
            [alt]="producto.nombre"
            (error)="imagenNoCarga($event)"
          />

        </div>

        <div class="form-group">

          <label for="imagen">
            URL de la imagen
          </label>

          <input
            id="imagen"
            type="url"
            [(ngModel)]="producto.imagen"
            placeholder="https://..."
          />

        </div>

        <p>
          Imagen representativa del producto.
        </p>

      </div>


      <div class="fields-section">

        <div class="form-group">

          <label for="nombre">
            Nombre del producto *
          </label>

          <input
            id="nombre"
            type="text"
            [(ngModel)]="producto.nombre"
            placeholder="Ej. Muñeco de nieve"
          />

        </div>


        <div class="form-group">

          <label for="proveedor">
            Proveedor *
          </label>

          <select
            id="proveedor"
            [(ngModel)]="producto.proveedor"
          >
            <option
              *ngFor="let nombreProveedor of proveedores"
              [value]="nombreProveedor"
            >
              {{ nombreProveedor }}
            </option>
          </select>

        </div>


        <div class="form-group">

          <label for="tamano">
            Tamaño *
          </label>

          <input
            id="tamano"
            type="text"
            [(ngModel)]="producto.tamano"
            placeholder="Ej. 15 cm"
          />

        </div>


        <div class="form-group">

          <label for="costo">
            Costo (COP)
          </label>

          <input
            id="costo"
            type="number"
            min="0"
            [(ngModel)]="producto.costo"
          />

        </div>


        <div class="form-group">

          <label for="precioVenta">
            Precio de venta en local (COP)
          </label>

          <input
            id="precioVenta"
            type="number"
            min="0"
            [(ngModel)]="producto.precio_venta"
          />

        </div>


        <div class="form-group">

          <label for="precioMayorista">
            Precio mayorista (COP)
          </label>

          <input
            id="precioMayorista"
            type="number"
            min="0"
            [(ngModel)]="producto.precio_mayorista"
          />

        </div>


        <div class="form-group full-width">

          <label for="descripcion">
            Descripción
          </label>

          <textarea
            id="descripcion"
            rows="5"
            [(ngModel)]="producto.descripcion"
            placeholder="Describe el producto..."
          ></textarea>

        </div>

      </div>

    </div>


    <div class="form-actions">

      <button
        type="button"
        class="cancel-button"
        (click)="cancelar()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="save-button"
        [disabled]="cargando || guardando"
        (click)="guardarCambios()"
      >
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>

    </div>

  </section>

</div>
